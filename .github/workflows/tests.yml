# Unit + end-to-end tests for BonitoAgents.
#
# `setup` resolves the envs once and shares two things with every other job: the
# resolved Manifests (an artifact) and a compiled depot (a run-scoped cache).
# `unit` and the `e2e` shards then run in parallel off both.
#
# The e2e items are SHARDED — 8 jobs, every 8th item — and not one job per suite.
# A suite item runs for well under a minute, while a job costs a checkout, an apt
# install and a 730 MB depot restore, so a job per suite burned ~9 runner-hours
# per push to run ~70 minutes of test.
#
# Two things the jobs depend on:
#
#   • COMPILE OUTSIDE THE TEST. Every job warms its envs in a separate step
#     (`.github/scripts/warmup.jl` imports each env's deps). Whatever the depot
#     cache fails to provide is paid there, where no test is waiting on a DOM.
#     Jobs used to compile the stack (~220 s) inside a `timeout 420` wrapper and
#     get killed mid-suite; the per-ITEM budget now lives in runtests.jl.
#
#   • NOBODY RE-RESOLVES. The forks (Bonito, BonitoBook, BonitoWidgets,
#     ElectronCall, Makie) are pinned to moving branch HEADs in [sources], so a
#     job that resolved for itself would get other commits than the ones setup
#     compiled. Manifest.toml is gitignored, so setup shares its resolved ones as
#     an artifact and every downstream job copies them in before touching Julia.
name: Tests

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  JULIA_VERSION: '1.12'
  # Keyed on the Project.toml set (the Manifests are gitignored and regenerated);
  # `run_id` pins it to this run, because setup updates the forks to branch HEADs
  # and the compiled images only match the commits THIS run resolved.
  DEPOT_KEY_PREFIX: julia-depot-v1
  # Resolving never precompiles; the explicit warmup step does, in a fresh process.
  JULIA_PKG_PRECOMPILE_AUTO: '0'

jobs:
  # ── Resolve + compile once ────────────────────────────────────────────────
  setup:
    name: setup (resolve + compile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      # Save under a run-scoped key; warm-start from any earlier run via
      # restore-keys so package tarballs and artifacts aren't re-downloaded.
      - uses: actions/cache@v4
        with:
          path: ~/.julia
          key: ${{ env.DEPOT_KEY_PREFIX }}-${{ runner.os }}-jl${{ env.JULIA_VERSION }}-${{ hashFiles('BonitoAgents/Project.toml', 'BonitoAgents/test/Project.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.DEPOT_KEY_PREFIX }}-${{ runner.os }}-jl${{ env.JULIA_VERSION }}-${{ hashFiles('BonitoAgents/Project.toml', 'BonitoAgents/test/Project.toml') }}-
            ${{ env.DEPOT_KEY_PREFIX }}-${{ runner.os }}-jl${{ env.JULIA_VERSION }}-

      - name: Resolve + refresh the git-pinned forks
        # The UI forks (Bonito, BonitoBook, BonitoWidgets) are [sources] of the
        # main env; ElectronCall is TEST-only, and the eval envs carry their own
        # Bonito/Makie pins — update each fork in the env it actually lives in
        # (`Pkg.update(["ElectronCall"])` on the main env errors with "not found
        # in project or manifest").
        run: |
          julia --project=BonitoAgents -e '
            using Pkg
            Pkg.instantiate()
            Pkg.update(["Bonito", "BonitoWidgets", "BonitoBook"])'
          julia --project=BonitoAgents/test -e '
            using Pkg
            Pkg.instantiate()
            Pkg.update(["ElectronCall", "Bonito", "BonitoWidgets", "BonitoBook"])'
          for env in evalenv altenv; do
            julia --project=BonitoAgents/test/$env -e 'using Pkg; Pkg.instantiate()'
          done

      - name: Every pin took, and the eval proxy shares one Bonito
        # Two silent failures this catches: a `[sources]` entry that did nothing
        # (it only governs packages the project DECLARES — in [extras] it is
        # ignored and the registry version wins), and the server-side env and the
        # eval-worker envs landing on different commits of the same branch. Both
        # end as an embed that renders its static DOM and never comes alive,
        # which reads as a timing flake across eight e2e suites.
        run: |
          julia .github/scripts/check_pins.jl \
            BonitoAgents/test \
            BonitoAgents/test/evalenv \
            BonitoAgents/test/altenv

      - name: Compile the stack
        # A FRESH process per env, after all resolving is done. Compiling from the
        # process that just resolved builds images against the versions that
        # process had loaded, which every later process rejects and rebuilds.
        run: |
          for env in BonitoAgents BonitoAgents/test BonitoAgents/test/evalenv BonitoAgents/test/altenv; do
            julia --project=$env .github/scripts/warmup.jl
          done

      - name: Share the resolved Manifests
        uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: |
            BonitoAgents/Manifest.toml
            BonitoAgents/test/Manifest.toml
            BonitoAgents/test/evalenv/Manifest.toml
            BonitoAgents/test/altenv/Manifest.toml
          if-no-files-found: error
          retention-days: 1

  # ── Unit tests (headless) ─────────────────────────────────────────────────
  unit:
    name: unit tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests-dl
      # The artifact is rooted at BonitoAgents/ (the common ancestor of the four
      # uploaded paths), so this one copy restores all of them.
      - name: Restore the shared Manifests
        # …and fail here if they didn't land where they're expected, rather than
        # let the job silently re-resolve to other fork commits than setup's.
        run: |
          cp -r manifests-dl/. BonitoAgents/
          test -f BonitoAgents/Manifest.toml
          test -f BonitoAgents/test/Manifest.toml
      - uses: actions/cache/restore@v4
        with:
          path: ~/.julia
          key: ${{ env.DEPOT_KEY_PREFIX }}-${{ runner.os }}-jl${{ env.JULIA_VERSION }}-${{ hashFiles('BonitoAgents/Project.toml', 'BonitoAgents/test/Project.toml') }}-${{ github.run_id }}
      - name: Warm the envs this job loads
        run: |
          for env in BonitoAgents BonitoAgents/test; do
            julia --project=$env .github/scripts/warmup.jl
          done

      - name: Unit tests
        # runtests.jl + ReTestItems + the test deps live in the TEST env, not the
        # main package. `unit` matches the `unit:*` item names; the e2e shards
        # take the browser items.
        run: julia --project=BonitoAgents/test BonitoAgents/test/runtests.jl unit

      - name: RemoteSync transfer tests (incl. close-vs-tail stress)
        # RemoteSync is a path [source] of BonitoAgents, so its deps are already
        # in this env — run its suite here rather than spin up a separate project.
        # Guards the close-vs-tail race that production file-open relies on.
        run: julia --project=BonitoAgents RemoteSync/test/runtests.jl

      - name: WorkerLink tests (resume, flow control, wedged peers)
        # Also a path [source] of BonitoAgents; its test deps are HTTP and stdlibs.
        run: julia --project=BonitoAgents WorkerLink/test/runtests.jl

  # ── E2E suite — sharded across parallel jobs ──────────────────────────────
  e2e:
    name: 'E2E ${{ matrix.shard }}/8'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISPLAY: ":99"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Install Xvfb + Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus libgtk-3-0 libnss3 libasound2t64 libgbm1 \
            libxss1 libxtst6 libatk-bridge2.0-0 libdrm2
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests-dl
      - name: Restore the shared Manifests
        # …and fail here if they didn't land where they're expected, rather than
        # let the job silently re-resolve to other fork commits than setup's.
        run: |
          cp -r manifests-dl/. BonitoAgents/
          test -f BonitoAgents/Manifest.toml
          test -f BonitoAgents/test/Manifest.toml
      - uses: actions/cache/restore@v4
        with:
          path: ~/.julia
          key: ${{ env.DEPOT_KEY_PREFIX }}-${{ runner.os }}-jl${{ env.JULIA_VERSION }}-${{ hashFiles('BonitoAgents/Project.toml', 'BonitoAgents/test/Project.toml') }}-${{ github.run_id }}
      - name: Warm the test + eval envs
        # The eval envs matter as much as the test env: an eval item's Malt worker
        # mounts a render inside a 30 s DOM wait, and a worker that compiles
        # WGLMakie on first touch never makes it.
        run: |
          for env in BonitoAgents/test BonitoAgents/test/evalenv BonitoAgents/test/altenv; do
            julia --project=$env .github/scripts/warmup.jl
          done

      - name: 'E2E shard ${{ matrix.shard }}/8'
        # `^e2e:` selects the browser items, `N/8` takes this job's share. The
        # filter is matched against testitem NAMES and is anchored on purpose: a
        # bare `e2e` would also match nothing useful, while a bare suite name like
        # `file_tree` matches `unit:file_tree` too, which starts a SECOND
        # dev_server inside this process (reproduced: `e2e:file_tree` passes 19/19
        # alone, 10/19 with the unit item alongside it).
        run: |
          xvfb-run -a -s "-screen 0 1280x900x24" \
            julia --project=BonitoAgents/test BonitoAgents/test/runtests.jl '^e2e:' ${{ matrix.shard }}/8

  # ── Single required check for branch protection ───────────────────────────
  all-green:
    name: all tests green
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: echo "unit + all e2e shards passed"
