# Minimal env for the e2e app-embed tests' bt_show_app eval worker. The apps
# only `using Bonito`, so this pins ONLY dev Bonito (v5, with the proxy API
# bt_show_app needs). Pre-instantiated by runtests.jl so the eval worker finds
# a resolved+precompiled env instead of re-resolving the heavy test env (which
# timed app mounts out). Manifest is generated locally and gitignored.
[deps]
Bonito = "824d6782-a2ef-11e9-3a09-e5662e0c26f8"

[sources]
Bonito = {path = "../../../../Bonito"}
