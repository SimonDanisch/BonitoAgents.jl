<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How BonitoAgents fits together</title>
  <desc>Any ACP agent (Claude Code, Codex, Kimi Code, OpenCode, MiMo or your own) runs on a worker on any of your machines. Each worker keeps one link to a self-hosted dashboard server, which any browser or phone opens to see and steer every chat and everything the agents make.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a3"/>
    </marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e27f46"/>
      <stop offset="50%" stop-color="#dd3366"/>
      <stop offset="100%" stop-color="#875b91"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="468" rx="18" fill="#ffffff" stroke="#e3e6ec" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="6" rx="3" fill="url(#brand)"/>

  <!-- column headers -->
  <g font-size="13" font-weight="700" fill="#5b6372" letter-spacing="1.2">
    <text x="40" y="50">ANY ACP AGENT</text>
    <text x="340" y="50">EVERY MACHINE YOU OWN</text>
    <text x="700" y="50">ONE DASHBOARD, ANY BROWSER</text>
  </g>

  <!-- agents -->
  <g font-size="16" font-weight="600" fill="#2a2f3a">
    <rect x="40" y="70" width="210" height="40" rx="10" fill="#fdf1ea" stroke="#f3c7ab"/>
    <circle cx="62" cy="90" r="7" fill="#e27f46"/>
    <text x="80" y="96">Claude Code</text>

    <rect x="40" y="120" width="210" height="40" rx="10" fill="#eef0f3" stroke="#c9ced8"/>
    <circle cx="62" cy="140" r="7" fill="#2a2f3a"/>
    <text x="80" y="146">Codex</text>

    <rect x="40" y="170" width="210" height="40" rx="10" fill="#eaf2f9" stroke="#b6d1ea"/>
    <circle cx="62" cy="190" r="7" fill="#3182bb"/>
    <text x="80" y="196">Kimi Code</text>

    <rect x="40" y="220" width="210" height="40" rx="10" fill="#f1f6ec" stroke="#cbdcba"/>
    <circle cx="62" cy="240" r="7" fill="#8ca670"/>
    <text x="80" y="246">OpenCode</text>

    <rect x="40" y="270" width="210" height="40" rx="10" fill="#fceaf0" stroke="#f0b8ca"/>
    <circle cx="62" cy="290" r="7" fill="#dd3366"/>
    <text x="80" y="296">MiMo</text>

    <rect x="40" y="320" width="210" height="40" rx="10" fill="#ffffff" stroke="#875b91" stroke-dasharray="5 4"/>
    <circle cx="62" cy="340" r="7" fill="none" stroke="#875b91" stroke-width="2"/>
    <text x="80" y="346" fill="#875b91">your own agent</text>
  </g>
  <text x="40" y="388" font-size="13" fill="#5b6372">pick one per chat, switch any time:</text>
  <text x="40" y="406" font-size="13" fill="#5b6372">the conversation comes along</text>

  <!-- agents to machines -->
  <path d="M 262 215 L 326 215" stroke="#8a93a3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="294" y="204" font-size="12" font-weight="700" fill="#5b6372" text-anchor="middle">ACP</text>

  <!-- machines -->
  <g>
    <rect x="340" y="70" width="260" height="54" rx="12" fill="#ffffff" stroke="#d5dae3" stroke-width="1.5"/>
    <text x="358" y="93" font-size="16" font-weight="700" fill="#2a2f3a">Laptop</text>
    <text x="358" y="113" font-size="12.5" fill="#5b6372">agents, Julia session, your repos</text>

    <rect x="340" y="134" width="260" height="54" rx="12" fill="#ffffff" stroke="#d5dae3" stroke-width="1.5"/>
    <text x="358" y="157" font-size="16" font-weight="700" fill="#2a2f3a">Desktop with the GPU</text>
    <text x="358" y="177" font-size="12.5" fill="#5b6372">long runs, renders, big data</text>

    <rect x="340" y="198" width="260" height="54" rx="12" fill="#ffffff" stroke="#d5dae3" stroke-width="1.5"/>
    <text x="358" y="221" font-size="16" font-weight="700" fill="#2a2f3a">Mac</text>
    <text x="358" y="241" font-size="12.5" fill="#5b6372">the same tools, another OS</text>

    <rect x="340" y="262" width="260" height="54" rx="12" fill="#ffffff" stroke="#d5dae3" stroke-width="1.5"/>
    <text x="358" y="285" font-size="16" font-weight="700" fill="#2a2f3a">Windows PC</text>
    <text x="358" y="305" font-size="12.5" fill="#5b6372">a worker like any other</text>

    <rect x="340" y="326" width="260" height="54" rx="12" fill="#ffffff" stroke="#d5dae3" stroke-width="1.5"/>
    <text x="358" y="349" font-size="16" font-weight="700" fill="#2a2f3a">Server in the closet</text>
    <text x="358" y="369" font-size="12.5" fill="#5b6372">always on, runs the dashboard too</text>
  </g>
  <text x="340" y="406" font-size="13" fill="#5b6372">chats move between machines with</text>
  <text x="340" y="424" font-size="13" fill="#5b6372">their files and the agent's memory</text>

  <!-- machines to dashboard -->
  <path d="M 612 215 L 686 215" stroke="#8a93a3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="649" y="196" font-size="12" font-weight="700" fill="#5b6372" text-anchor="middle">one link</text>
  <text x="649" y="236" font-size="12" font-weight="700" fill="#5b6372" text-anchor="middle">dialing out</text>

  <!-- dashboard -->
  <rect x="700" y="70" width="260" height="54" rx="12" fill="#2a2f3a"/>
  <text x="718" y="93" font-size="16" font-weight="700" fill="#ffffff">Dashboard server</text>
  <text x="718" y="113" font-size="12.5" fill="#c9ced8">self-hosted, passkey login</text>

  <rect x="700" y="134" width="260" height="246" rx="12" fill="#f7f8fa" stroke="#d5dae3" stroke-width="1.5"/>
  <rect x="700" y="134" width="260" height="26" rx="12" fill="#e9ecf1"/>
  <rect x="700" y="148" width="260" height="12" fill="#e9ecf1"/>
  <circle cx="716" cy="147" r="4" fill="#dd3f33"/>
  <circle cx="730" cy="147" r="4" fill="#e8cb26"/>
  <circle cx="744" cy="147" r="4" fill="#8ca670"/>
  <g font-size="13.5" font-weight="600" fill="#2a2f3a" text-anchor="middle">
    <rect x="714" y="174" width="112" height="32" rx="8" fill="#fdf1ea"/><text x="770" y="195">plots</text>
    <rect x="834" y="174" width="112" height="32" rx="8" fill="#fceaf0"/><text x="890" y="195">video</text>
    <rect x="714" y="214" width="112" height="32" rx="8" fill="#eaf2f9"/><text x="770" y="235">notebooks</text>
    <rect x="834" y="214" width="112" height="32" rx="8" fill="#f3edf5"/><text x="890" y="235">3D models</text>
    <rect x="714" y="254" width="112" height="32" rx="8" fill="#f1f6ec"/><text x="770" y="275">tables</text>
    <rect x="834" y="254" width="112" height="32" rx="8" fill="#fdf7dd"/><text x="890" y="275">PDF</text>
    <rect x="714" y="294" width="112" height="32" rx="8" fill="#eef0f3"/><text x="770" y="315">diffs</text>
    <rect x="834" y="294" width="112" height="32" rx="8" fill="url(#brand)"/><text x="890" y="315" fill="#ffffff">live apps</text>
  </g>
  <text x="830" y="358" font-size="12.5" fill="#5b6372" text-anchor="middle">on your desk or on your phone</text>
  <text x="700" y="406" font-size="13" fill="#5b6372">share a report or a live app</text>
  <text x="700" y="424" font-size="13" fill="#5b6372">with a link, no account needed</text>

  <text x="500" y="452" font-size="13.5" font-weight="600" fill="#2a2f3a" text-anchor="middle">Your code in ordinary folders, your transcripts on your disk, your agent accounts. No BonitoAgents cloud.</text>
</svg>
